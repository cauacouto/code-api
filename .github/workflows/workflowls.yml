name: Build and Deploy Codechella

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixar o código do repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar o Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Autenticar no Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Construir e enviar a imagem para o Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/codechella:latest

      # 5. Configurar a chave SSH privada
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.PRIVATE_KEY }}

      # 6. Registrar a chave pública da EC2
      - name: Add EC2 to known_hosts
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      # 7. Gerar o arquivo .env com os GitHub Secrets
      - name: Generate environment file
        env:
          HOST_DATABASE: ${{ secrets.HOST_DATABASE }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          python3 <<'PY'
          import os

          names = [
              "HOST_DATABASE",
              "DB_USER",
              "DB_PASSWORD",
              "MAIL_HOST",
              "MAIL_USER",
              "MAIL_PASSWORD",
              "JWT_SECRET",
          ]

          with open(".env", "w", encoding="utf-8") as file:
              for name in names:
                  value = os.environ.get(name)

                  if value is None or value == "":
                      raise ValueError(
                          f"A variável obrigatória {name} está vazia."
                      )

                  # Aspas simples evitam interpolação de $ no .env.
                  # Escapamos apóstrofos para preservar o valor.
                  value = value.replace("'", "\\'")

                  file.write(f"{name}='{value}'\n")

          os.chmod(".env", 0o600)
          PY

      # 8. Verificar se o Docker Compose existe
      - name: Check Docker Compose configuration
        run: docker compose config --quiet

      # 9. Criar o diretório da aplicação na EC2
      - name: Create deployment directory
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh \
            -o StrictHostKeyChecking=yes \
            ubuntu@"$EC2_HOST" \
            'mkdir -p /home/ubuntu/codechella'

      # 10. Copiar o Compose e o .env para a EC2
      - name: Copy deployment files to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          scp \
            -o StrictHostKeyChecking=yes \
            docker-compose.yml \
            .env \
            ubuntu@"$EC2_HOST":/home/ubuntu/codechella/

      # 11. Baixar a imagem atualizada e executar o deploy
      - name: Deploy on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh \
            -o StrictHostKeyChecking=yes \
            ubuntu@"$EC2_HOST" <<'SSH'
              set -e

              cd /home/ubuntu/codechella

              echo "Baixando a imagem atualizada..."
              docker compose pull app

              echo "Iniciando os containers..."
              docker compose up -d --remove-orphans

              echo "Removendo imagens antigas não utilizadas..."
              docker image prune -f

              echo "Verificando os containers..."
              docker compose ps

              echo "Deploy concluído!"
          SSH

      # 12. Remover o .env do runner do GitHub Actions
      - name: Cleanup
        if: always()
        run: rm -f .env