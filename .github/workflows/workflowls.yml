name: CI/CD with Docker and GitHub Actions

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/codechella:latest .

      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/codechella:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Prepare environment file
        env:
          MYSQL_DATABASE: ${{ secrets.HOST_DATABASE }}
          MYSQL_USER: ${{ secrets.USER_DB }}
          MYSQL_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MAIL_HOST: ${{MAIL_HOST}}
          MAIL_USER: ${{MAIL_USER}}
          MAIL_PASSWORD: ${{MAIL_PASSWORD}}
          JWT_SECRET: ${{JWT_SECRET}}


        run: |
          umask 077

          printf "MYSQL_DATABASE='%s'\n" "$MYSQL_DATABASE" > .env
          printf "MYSQL_USER='%s'\n" "$MYSQL_USER" >> .env
          printf "MYSQL_PASSWORD='%s'\n" "$MYSQL_PASSWORD" >> .env
          printf "MYSQL_ROOT_PASSWORD='%s'\n" "$MYSQL_ROOT_PASSWORD" >> .env

      - name: Copy deployment files to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no \
            ubuntu@$EC2_HOST \
            "mkdir -p /home/ubuntu/codechella"

          scp docker-compose.yml .env \
            ubuntu@$EC2_HOST:/home/ubuntu/codechella/

      - name: Deploy application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@$EC2_HOST '
            set -e
            cd /home/ubuntu/codechella

            chmod 600 .env

            docker compose pull app
            docker compose up -d --remove-orphans

            docker image prune -f
          '

      - name: Clean up local environment file
        if: always()
        run: rm -f .env