name: CI/CD with Docker and GitHub Actions

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/codechella:latest" .

      - name: Push Docker image
        run: |
          docker push \
            "${{ secrets.DOCKERHUB_USERNAME }}/codechella:latest"

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Prepare environment file
        env:
          HOST_DATABASE: ${{ secrets.HOST_DATABASE }}
          USER_DB: ${{ secrets.USER_DB }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          names = [
              "HOST_DATABASE",
              "USER_DB",
              "DB_PASSWORD",
              "MYSQL_ROOT_PASSWORD",
              "MAIL_HOST",
              "MAIL_USER",
              "MAIL_PASSWORD",
              "JWT_SECRET",
          ]

          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit(
                  "GitHub Secrets ausentes ou vazios: " + ", ".join(missing)
              )

          def escape(value):
              return (
                  value.replace("\\", "\\\\")
                       .replace('"', '\\"')
                       .replace("$", "\\$")
                       .replace("`", "\\`")
              )

          content = "".join(
              f'{name}="{escape(os.environ[name])}"\n'
              for name in names
          )

          path = Path(".env")
          path.write_text(content)
          path.chmod(0o600)
          PY

      - name: Copy deployment files to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            ubuntu@"$EC2_HOST" \
            "mkdir -p /home/ubuntu/codechella"

          scp \
            -o StrictHostKeyChecking=yes \
            docker-compose.yml .env \
            ubuntu@"$EC2_HOST":/home/ubuntu/codechella/

      - name: Deploy application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh \
            -o StrictHostKeyChecking=yes \
            ubuntu@"$EC2_HOST" '
              set -e
              cd /home/ubuntu/codechella

              chmod 600 .env

              docker compose pull app
              docker compose up -d --remove-orphans

              docker image prune -f
              docker compose ps
          '

      - name: Clean up local environment file
        if: always()
        run: rm -f .env